[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plecs-mcp"
version = "0.1.0"
description = "MCP server exposing the complete Plexim PLECS JSON-RPC interface"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=4.1",
  "httpx>=0.28",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
plecs-mcp = "plecs_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
